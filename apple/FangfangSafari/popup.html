<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方方詞卡 查詞</title>
<style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 12px 14px 14px; min-width: 300px; background: #1e1f23; color: #f2f2f2;
        font: 15px/1.35 -apple-system, "PingFang TC", "Heiti TC", sans-serif; -webkit-text-size-adjust: none; }
    h1 { font-size: 16px; margin: 0; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .switch { position: relative; width: 52px; height: 30px; border-radius: 15px; background: #3a3a3d; border: 1px solid #4b4b4e; cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #f2f2f2; transition: left .15s; }
    .switch.on { background: #3fae66; border-color: #3fae66; }
    .switch.on::after { left: 25px; }
    .off { font-size: 13px; color: #a3a3a8; }
    .grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .col { flex: 1 0 140px; border-radius: 10px; padding: 6px 8px 8px; border-top: 4px solid transparent; }
    .col h2 { font-size: 14px; margin: 0 0 6px; }
    .col.zh { background: rgba(79,125,255,.12); border-top-color: #4f7dff; } .col.zh h2 { color: #9ad0ff; }
    .col.tw { background: rgba(63,174,102,.12); border-top-color: #3fae66; } .col.tw h2 { color: #b6f0c8; }
    .col.yue { background: rgba(201,162,39,.12); border-top-color: #c9a227; } .col.yue h2 { color: #ffe58a; }
    .col.hak { background: rgba(216,67,79,.12); border-top-color: #d8434f; } .col.hak h2 { color: #ffb3b8; }
    .col.sv { background: rgba(63,201,189,.10); border-top-color: #3fc9bd; } .col.sv h2 { color: #9cf0e6; }
    .col label { display: block; font-size: 12px; color: #c8c8cc; margin: 6px 0 2px; }
    .col select, .gen select { width: 100%; font-size: 13px; background: #2b2b2d; color: #f2f2f2; border: 1px solid #4b4b4e; border-radius: 7px; padding: 3px 4px; }
    .gen { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 10px; margin-top: 10px; }
    .gen label { display: block; font-size: 12px; color: #c8c8cc; margin: 4px 0 2px; }
    button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; background: #2b2b2d; border: 1px solid #4b4b4e; color: #f2f2f2; }
    button.send { background: #1d4630; border-color: #3fae66; color: #b6f0c8; }
    .note { font-size: 12px; color: #a3a3a8; margin-top: 8px; }
    .sec { margin-top: 12px; padding-top: 10px; border-top: 1px solid #3a3a3d; }
    .words { font-size: 14px; margin: 6px 0; color: #f2f2f2; }
    .row { display: flex; gap: 8px; }
</style>
</head>
<body>
    <div class="bar"><h1>方方詞卡 查詞</h1><div id="power" class="switch" role="switch" aria-label="開關"></div></div>
    <div id="main"></div>
    <script src="popup.js"></script>
</body>
</html>
