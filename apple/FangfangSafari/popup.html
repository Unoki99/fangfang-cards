<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方方詞卡 查詞</title>
<style>
    :root { color-scheme: dark; --web: #6eaaff; --subs: #c39bff; --send: #ff8cc6; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; min-width: 300px; background: #121318; color: #eef0f6;
        font: 15px/1.4 -apple-system, "PingFang TC", "Heiti TC", sans-serif; -webkit-text-size-adjust: none; }
    h1 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1 .logo { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 15px;
        background: linear-gradient(135deg, #3fae66, #4f7dff); }
    .card { background: #1c1d24; border: 1px solid #2e3039; border-radius: 14px; padding: 4px 12px; margin-bottom: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #2e3039; }
    .row:first-child { border-top: none; }
    .row b { display: block; } .row small { display: block; color: #9a9eb0; font-size: 12px; }
    .switch { flex: none; position: relative; width: 50px; height: 30px; border-radius: 15px; background: #3a3b42; border: 1px solid #4a4b53; padding: 0; cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #f2f2f2; transition: left .15s; }
    .switch.on { background: var(--c); border-color: var(--c); } .switch.on::after { left: 23px; }
    .words { font-size: 14px; margin: 8px 0; color: #dfe3ee; }
    .note { font-size: 12px; color: #9a9eb0; margin: 8px 0; }
    button.act { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 10px; background: #23242c; border: 1px solid #2e3039; color: #eef0f6; cursor: pointer; }
    button.main { background: rgba(255,140,198,.22); border-color: var(--send); }
    button.wide { width: 100%; padding: 10px; font-size: 15px; background: rgba(110,170,255,.16); border-color: var(--web); }
    .btns { display: flex; gap: 8px; margin: 8px 0 10px; }
    .off { font-size: 13px; color: #ffd166; margin-bottom: 10px; }
</style>
</head>
<body>
    <h1><span class="logo">方</span>方方詞卡 查詞</h1>
    <div id="main"></div>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
